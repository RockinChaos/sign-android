name: 'Sign Android Releases Apk'
description: 'An action to sign an Android release APK or AAB'
author: 'RockinChaos'
branding:
  icon: 'edit'
  color: 'blue'
outputs:
  signedFile:
    description: 'The signed release file path when exactly one file is signed'
  signedFiles:
    description: 'Signed release file paths, separated by colons (legacy)'
  signedFilesList:
    description: 'Absolute signed release file paths, separated by newlines'
  signedFilesJson:
    description: 'Absolute signed release file paths as a JSON array'
  signedFilesCount:
    description: 'The number of signed release files'
runs:
  using: 'node24'
  main: 'dist/index.js'
inputs:
  releaseDir:
    description: 'The directory to find your release to sign'
    required: true
  signingKey:
    description: 'The key used to sign your release in base64 encoded format'
    required: true
  keyAlias:
    description: 'The key alias'
    required: true
  keyStorePassword:
    description: 'The password to the keystore'
    required: true
  keyPassword:
    description: 'The password for the key'
    required: false
  buildToolsVersion:
    description: 'Preferred Android build tools to use'
    required: false
  appName:
    description: 'Preferred App Name for renaming'
    required: false
  appVersion:
    description: 'Preferred App Version for renaming'
    required: false
  appPrefix:
    description: 'Preferred App Prefix for renaming'
    required: false
