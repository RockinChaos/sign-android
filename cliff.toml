[remote.github]
owner = "RockinChaos"
repo = "sign-android"

[changelog]
header = ""
body = """
{% macro remote_url() -%}https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}{%- endmacro %}
{% for group, changes in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in changes -%}
- {% if commit.breaking %}**Breaking change:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))
{% if commit.body -%}
{% for paragraph in commit.body | trim | split(pat="\n\n") -%}
{% set detail = paragraph | replace(from="&#x20;", to=" ") | trim -%}
{% if detail %}  - {{ detail }}
{% endif -%}
{% endfor -%}
{% endif -%}
{% endfor %}
{% endfor %}
{% if commits | length == 0 %}
No user-facing changes in this release.
{% endif %}
{% if previous.version %}
**Full changelog:** [{{ previous.version }}...{{ version }}]({{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }})
{% endif %}
"""
footer = ""
trim = true
format = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^ver: [0-9]+\\.[0-9]+\\.[0-9]+-RELEASE$", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^(ci|test|build|refactor|style)(\\(|:|!)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs?", group = "<!-- 3 -->Documentation" },
  { message = "^revert", group = "<!-- 4 -->Reverts" },
  { message = "^chore", group = "<!-- 5 -->Maintenance" },
]
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "oldest"
